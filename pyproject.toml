[project]
name = "bird-strike-radar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "jax>=0.11.2",
    "jupyterlab>=4.6.4",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpyro>=0.22.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
]

[project.scripts]
bird-strike-radar = "bird_strike_radar:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
